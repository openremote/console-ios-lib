
name: CI/CD

on:
  # Push on main excluding tags
  push:
    branches:
      - 'main'
    tags-ignore:
      - '*.*'

  # PR
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: CI/CD
    runs-on: macos-15
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check SonarQube availability
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SonarQube analysis enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SonarQube analysis disabled (SONAR_TOKEN not set)"
          fi

      - name: Install tooling
        run: |
          brew install xcresultparser swiftlint

      - name: Download SonarQube coverage converter
        if: ${{ steps.sonar.outputs.enabled == 'true' }}
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/SonarSource/sonar-scanning-examples/de677435078ca8873be775e7f718d8dd0669c03d/swift-coverage/swift-coverage-example/xccov-to-sonarqube-generic.sh \
            -o xccov-to-sonarqube-generic.sh

      - name: Swift Package Manager cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Generate SwiftLint SARIF
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          swiftlint lint --no-cache --quiet --config .swiftlint.yml --reporter sarif ORLib > swiftlint.sarif || true

      - name: Upload SwiftLint SARIF
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # 4.37.3
        with:
          sarif_file: swiftlint.sarif
          category: swiftlint

      - name: Generate SwiftLint JSON Report
        if: ${{ !cancelled() && steps.sonar.outputs.enabled == 'true' }}
        run: |
          swiftlint lint --no-cache --quiet --config .swiftlint.yml --reporter json ORLib > swiftlint.json || true

      - name: Build and test
        timeout-minutes: 20
        run: |
          xcodebuild test -project ORLib.xcodeproj -sdk iphoneos \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.6' -scheme ORLib \
          -test-timeouts-enabled YES \
          -default-test-execution-time-allowance 60 \
          -maximum-test-execution-time-allowance 60 \
          -resultBundlePath ORLib.xcresult

      - name: Upload XCResult bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() && hashFiles('ORLib.xcresult/**') != '' }}
        with:
          name: ORLib-xcresult
          path: ORLib.xcresult
          if-no-files-found: error

      - name: Extract JUnit test report
        run: |
          xcresultparser -o junit ORLib.xcresult > junit.xml
        if: ${{ !cancelled() }}

      - name: Convert test coverage to SonarQube format
        if: ${{ always() && !cancelled() && steps.sonar.outputs.enabled == 'true' && hashFiles('ORLib.xcresult/**') != '' }}
        run: |
          bash xccov-to-sonarqube-generic.sh ORLib.xcresult/ > Coverage.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        if: ${{ !cancelled() && steps.sonar.outputs.enabled == 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Publish Test Report with Insights
        uses: ctrf-io/github-test-reporter@e500b992f936420eb633c91644cf10d4d71df700 # v1.1.0
        if: ${{ !cancelled() }}
        with:
          report-path: 'junit.xml'
          integrations-config: |
            {
              "junit-to-ctrf": {
                "enabled": true,
                "action": "convert",
                "options": {
                  "output": "./ctrf-reports/ctrf-report.json",
                  "toolname": "junit-to-ctrf",
                  "useSuiteName": false,
                  "env": {
                    "appName": "ORLib"
                  }
                }
              }
            }
          github-report: true
          upload-artifact: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: ORLib Tests
          path: junit.xml
          reporter: jest-junit

