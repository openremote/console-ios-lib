name: CI/CD

on:
  # Push on main excluding tags
  push:
    branches:
      - 'main'
    tags-ignore:
      - '*.*'

  # PR
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: CI/CD
    runs-on: macos-15
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install tooling
        run: |
          brew install xcresultparser swiftlint
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/SonarSource/sonar-scanning-examples/7e7cba7dedc50d72a7f5715bce8c6517f5d324b4/swift-coverage/swift-coverage-example/xccov-to-sonarqube-generic.sh \
            -o xccov-to-sonarqube-generic.sh

      - name: Swift Package Manager cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Generate SwiftLint SARIF
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          swiftlint lint --no-cache --quiet --config .swiftlint.yml --reporter sarif ORLib > swiftlint.sarif || true

      - name: Upload SwiftLint SARIF
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: swiftlint.sarif
          category: swiftlint

      - name: Generate SwiftLint JSON Report
        if: ${{ !cancelled() }}
        run: |
          swiftlint lint --no-cache --quiet --config .swiftlint.yml --reporter json ORLib > swiftlint.json || true

      - name: Build and test
        timeout-minutes: 20
        run: |
          xcodebuild test -project ORLib.xcodeproj -sdk iphoneos \
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.6' -scheme ORLib \
          -test-timeouts-enabled YES \
          -default-test-execution-time-allowance 60 \
          -maximum-test-execution-time-allowance 60 \
          -resultBundlePath ORLib.xcresult

      - name: Upload XCResult bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && !cancelled() && hashFiles('ORLib.xcresult/**') != '' }}
        with:
          name: ORLib-xcresult
          path: ORLib.xcresult
          if-no-files-found: error

      - name: Extract JUnit test report
        run: |
          xcresultparser -o junit ORLib.xcresult > junit.xml
        if: ${{ !cancelled() }}

      - name: Convert test coverage to SonarQube format
        if: ${{ always() && !cancelled() && hashFiles('ORLib.xcresult/**') != '' }}
        run: |
          bash xccov-to-sonarqube-generic.sh ORLib.xcresult/ > Coverage.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        if: ${{ !cancelled() }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Publish Test Report with Insights
        uses: ctrf-io/github-test-reporter@dbb08957b5b2af918b39136ab2c5532002c7649b # v1.3.2
        if: ${{ !cancelled() }}
        with:
          report-path: 'junit.xml'
          integrations-config: |
            {
              "junit-to-ctrf": {
                "enabled": true,
                "action": "convert",
                "options": {
                  "output": "./ctrf-reports/ctrf-report.json",
                  "toolname": "junit-to-ctrf",
                  "useSuiteName": false,
                  "env": {
                    "appName": "ORLib"
                  }
                }
              }
            }
          github-report: true
          upload-artifact: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: ORLib Tests 
          path: junit.xml
          reporter: jest-junit
